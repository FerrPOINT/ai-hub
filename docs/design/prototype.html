<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="design-baseline" content="AIHUB-DESIGN-1" />
    <meta name="color-scheme" content="dark light" />
    <title>AI Hub — интерактивный дизайн</title>
    <style id="base-token-snapshot">
      :root {
        --color-background: #09090b;
        --color-surface: #18181b;
        --color-surface-raised: #27272a;
        --color-border: #27272a;
        --color-border-strong: #3f3f46;
        --color-text-primary: #fafafa;
        --color-text-secondary: #d4d4d8;
        --color-text-muted: #a1a1aa;
        --color-accent: #818cf8;
        --color-accent-foreground: #18181b;
        --color-accent-hover: #a5b4fc;
        --color-danger: #f87171;
        --color-success: #4ade80;
        --color-warning: #fbbf24;
        --color-focus: var(--color-accent);
        --color-popover: var(--color-surface);
        --color-popover-foreground: var(--color-text-primary);
        /* Compatibility aliases for one release. */
        --color-primary: var(--color-accent);
        --color-primary-foreground: var(--color-accent-foreground);
        --color-secondary: var(--color-surface-raised);
        --color-secondary-foreground: var(--color-text-primary);
        --color-muted: var(--color-surface-raised);
        --color-muted-foreground: var(--color-text-muted);
        --color-destructive: var(--color-danger);
        --color-destructive-foreground: #18181b;
      }

      :root {
        --shell-sidebar-expanded: 264px;
        --shell-sidebar-compact: 72px;
        --shell-header-height: 60px;
        --shell-page-gutter: clamp(16px, 2vw, 32px);
        --shell-page-block-gap: 20px;
        --shell-control-min: 40px;
        --shell-control-mobile-min: 44px;
        --shell-readable-width: 760px;
        --shell-aside-width: 320px;
        --base-font-body: 14px;
        --base-font-label: 12px;
        --base-font-page-title: 24px;
        --base-radius: 6px;
      }

      .base-control {
        min-height: var(--shell-control-min);
      }
      .base-icon-control {
        min-width: var(--shell-control-min);
      }
      .base-app-shell {
        min-height: 100dvh;
        background: var(--color-background);
        color: var(--color-text-primary);
        font-size: var(--base-font-body);
        letter-spacing: 0;
      }
      .base-shell-sidebar {
        position: fixed;
        inset: var(--shell-header-height) auto 0 0;
        z-index: 20;
        display: flex;
        width: var(--shell-sidebar-expanded);
        flex-direction: column;
        border-right: 1px solid var(--color-border);
        background: var(--color-surface);
      }
      .base-shell-brand {
        display: flex;
        height: var(--shell-header-height);
        flex-shrink: 0;
        align-items: center;
        padding: 0 20px;
        border-bottom: 1px solid var(--color-border);
      }
      .base-shell-identity {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 12px;
      }
      .base-shell-identity-text {
        min-width: 0;
      }
      .base-shell-navigation-scroll {
        min-height: 0;
        flex: 1;
        overflow-y: auto;
        padding: 12px;
      }
      .base-shell-navigation {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .base-shell-link {
        display: flex;
        min-height: var(--shell-control-min);
        min-width: 0;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-radius: var(--base-radius);
        color: var(--color-text-secondary);
      }
      .base-shell-nav-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .base-shell-link:hover,
      .base-shell-link.is-active {
        background: var(--color-surface-raised);
        color: var(--color-text-primary);
      }
      .base-shell-link:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }
      .base-shell-work {
        min-width: 0;
        padding-left: var(--shell-sidebar-expanded);
      }
      .base-shell-main {
        min-height: calc(100dvh - var(--shell-header-height));
        outline: none;
      }
      .base-shell-drawer-trigger,
      .base-shell-mobile-title {
        display: none;
      }
      .base-shell-drawer {
        left: 0;
        top: 0;
        display: flex;
        height: 100dvh;
        max-height: 100dvh;
        width: min(320px, calc(100% - 2rem));
        max-width: none;
        transform: none;
        flex-direction: column;
        gap: 0;
        border-radius: 0;
        border-top: 0;
        border-bottom: 0;
        border-left: 0;
        padding: 0;
      }
      dialog.base-shell-drawer {
        position: fixed;
        margin: 0;
        color: var(--color-text-primary);
        background: var(--color-surface);
        border-color: var(--color-border);
      }
      dialog.base-shell-drawer:not([open]) {
        display: none;
      }
      dialog.base-shell-drawer::backdrop {
        background: rgb(0 0 0 / 65%);
      }
      .base-shell-drawer-title {
        display: flex;
        height: var(--shell-header-height);
        flex-shrink: 0;
        align-items: center;
        border-bottom: 1px solid var(--color-border);
        padding: 0 56px 0 16px;
      }
      .base-page-stack {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: var(--shell-page-block-gap);
      }
      .base-page-header {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      .base-page-title {
        overflow-wrap: anywhere;
        font-size: var(--base-font-page-title);
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: 0;
      }
      .base-page-actions,
      .base-filter-row {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .base-form-field {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 6px;
      }

      @media (min-width: 768px) and (max-width: 1279px) {
        .base-shell-sidebar {
          width: var(--shell-sidebar-compact);
        }
        .base-shell-brand {
          justify-content: center;
          padding: 0 8px;
        }
        .base-shell-identity-text,
        .base-shell-nav-label {
          display: none;
        }
        .base-shell-navigation-scroll {
          padding: 12px 8px;
        }
        .base-shell-link {
          justify-content: center;
          padding: 8px;
        }
        .base-shell-work {
          padding-left: var(--shell-sidebar-compact);
        }
      }
      @media (max-width: 767px) {
        .base-control,
        .base-shell-link {
          min-height: var(--shell-control-mobile-min);
        }
        .base-icon-control {
          min-width: var(--shell-control-mobile-min);
        }
        .base-shell-sidebar {
          display: none;
        }
        .base-shell-work {
          padding-left: 0;
        }
        .base-shell-drawer-trigger {
          display: inline-flex;
        }
        .base-shell-mobile-title {
          display: block;
          max-width: 80px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          font-weight: 600;
        }
        .base-page-header,
        .base-page-actions {
          width: 100%;
        }
      }

      .shell-main {
        min-width: 0;
        width: 100%;
      }

      .platform-header {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        min-width: 0;
        height: var(--shell-header-height);
        align-items: center;
        gap: 8px;
        padding-inline: 12px;
        border-bottom: 1px solid var(--color-border);
        background: var(--color-surface);
      }

      .platform-header-leading,
      .platform-header-context,
      .platform-header-actions {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
      }

      .platform-header-context {
        flex: 1;
      }

      .platform-header-services,
      .platform-header-actions {
        flex-shrink: 0;
      }

      .platform-header-actions {
        margin-left: auto;
      }

      .platform-header
        [data-platform-header-slot]
        :is(button, a, input, select) {
        min-height: var(--shell-control-mobile-min);
        min-width: var(--shell-control-mobile-min);
      }

      .service-switcher-label {
        max-width: 160px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @media (min-width: 768px) {
        .platform-header {
          padding-inline: 16px;
        }

        .platform-header
          [data-platform-header-slot]
          :is(button, a, input, select) {
          min-height: var(--shell-control-min);
          min-width: var(--shell-control-min);
        }
      }

      .page-frame {
        min-width: 0;
        width: 100%;
        padding: var(--shell-page-gutter);
      }

      .page-wide,
      .page-detail {
        min-width: 0;
        width: 100%;
      }

      .page-readable {
        min-width: 0;
        width: min(100%, var(--shell-readable-width));
      }

      .page-split {
        display: grid;
        min-width: 0;
        width: 100%;
        grid-template-columns: minmax(0, 1fr) var(--shell-aside-width);
        gap: var(--shell-page-block-gap);
      }

      @media (max-width: 1023px) {
        .page-split {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      [data-theme="gray"] {
        --color-background: #1f1f23;
        --color-surface: #2a2a2f;
        --color-surface-raised: #3f3f46;
        --color-border: #3f3f46;
        --color-border-strong: #52525b;
        --color-text-primary: #f4f4f5;
        --color-text-secondary: #e4e4e7;
        --color-text-muted: #b4b4bd;
        --color-accent: #a5b4fc;
        --color-accent-foreground: #18181b;
        --color-accent-hover: #818cf8;
        --color-danger: #fca5a5;
        --color-destructive-foreground: #18181b;
        --color-success: #86efac;
        --color-warning: #fde047;
      }

      [data-theme="light"] {
        --color-background: #f4f4f5;
        --color-surface: #ffffff;
        --color-surface-raised: #f4f4f5;
        --color-border: #e4e4e7;
        --color-border-strong: #d4d4d8;
        --color-text-primary: #18181b;
        --color-text-secondary: #3f3f46;
        --color-text-muted: #52525b;
        --color-accent: #4f46e5;
        --color-accent-foreground: #ffffff;
        --color-accent-hover: #4338ca;
        --color-danger: #b91c1c;
        --color-destructive-foreground: #ffffff;
        --color-success: #166534;
        --color-warning: #92400e;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .platform-header-services {
        flex-shrink: 0;
      }
      .platform-header-services .service-button {
        white-space: nowrap;
        min-width: 82px;
      }
      .platform-header-context {
        margin-left: auto;
        flex: 1;
        min-width: 0;
        justify-content: flex-end;
        border-left: 0;
      }
      .platform-header .header-context {
        display: block;
        max-width: 200px;
        min-width: 0;
        min-height: 40px;
        background: var(--color-surface);
        color: var(--color-text-primary);
        border: 1px solid var(--color-border);
        border-radius: 6px;
      }
      @media (max-width: 767px) {
        .platform-header-context {
          display: flex;
          padding: 0;
        }
        .platform-header .header-context {
          display: block;
          max-width: 120px;
          min-height: 44px;
        }
        .platform-header {
          gap: 4px;
        }
        .platform-header-services .service-button {
          padding: 8px;
          max-width: 90px;
        }
      }
    </style>
    <style>
      [hidden] {
        display: none !important;
      }
      .base-shell-work.auth-work {
        padding-left: 0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.5 "Segoe UI",
          system-ui,
          sans-serif;
        background: var(--color-background);
        color: var(--color-text-primary);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      a,
      select,
      input,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 3px;
      }
      button,
      input,
      select,
      textarea {
        color: var(--color-text-primary);
        background: var(--color-surface);
        border: 1px solid var(--color-border-strong);
        border-radius: var(--base-radius);
      }
      input,
      select {
        min-height: 40px;
        padding: 8px 12px;
        width: 100%;
      }
      textarea {
        padding: 12px;
        width: 100%;
        min-height: 100px;
        resize: vertical;
      }
      input[type="checkbox"] {
        width: 20px;
        min-height: 20px;
        accent-color: var(--color-accent);
      }
      input[readonly] {
        background: var(--color-surface-raised);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 24px;
        line-height: 1.25;
        font-weight: 600;
        letter-spacing: 0;
      }
      h2 {
        font-size: 16px;
        font-weight: 600;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
      }
      svg.icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      small,
      .muted {
        color: var(--color-text-muted);
      }
      small,
      .label {
        font-size: 12px;
      }
      code,
      .mono {
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      label {
        display: block;
        color: var(--color-text-secondary);
        font-size: 12px;
        font-weight: 500;
        margin-bottom: 6px;
      }
      .btn {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid var(--color-border-strong);
        border-radius: 6px;
        background: var(--color-surface);
        font-weight: 500;
        white-space: normal;
        text-align: center;
      }
      .btn:hover {
        background: var(--color-surface-raised);
      }
      .btn.primary {
        background: var(--color-accent);
        color: var(--color-accent-foreground);
        border-color: var(--color-accent);
      }
      .btn.primary:hover {
        background: var(--color-accent-hover);
      }
      .btn.danger {
        color: var(--color-danger);
      }
      .btn.icon-only {
        min-width: 40px;
        padding: 8px;
      }
      .btn.quiet {
        border-color: transparent;
        background: transparent;
      }
      .btn.quiet:hover {
        background: var(--color-surface-raised);
      }
      .flex {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-width: 0;
      }
      .stack-tight {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .right {
        margin-left: auto;
      }
      .space {
        justify-content: space-between;
      }
      .align-start {
        align-items: flex-start;
      }
      .logo {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border: 1px solid var(--color-border-strong);
        border-radius: 6px;
        color: var(--color-accent);
        font-weight: 700;
      }
      .brand-name {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }
      .platform-header-services .service-button {
        max-width: 160px;
      }
      .header-context {
        color: var(--color-text-muted);
        padding-left: 12px;
        border-left: 1px solid var(--color-border-strong);
        white-space: nowrap;
      }
      .avatar {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        background: var(--color-surface-raised);
        border: 1px solid var(--color-border-strong);
        border-radius: 50%;
        font-size: 12px;
        font-weight: 600;
      }
      .nav-heading {
        font-size: 11px;
        letter-spacing: 0.05em;
        color: var(--color-text-muted);
        text-transform: uppercase;
        padding: 16px 12px 8px;
      }
      .base-shell-link {
        font-weight: 500;
      }
      .base-shell-link.is-active {
        background: color-mix(
          in srgb,
          var(--color-accent) 12%,
          var(--color-surface)
        );
        color: var(--color-accent);
      }
      .nav-foot {
        padding: 16px 24px;
        border-top: 1px solid var(--color-border);
        font-size: 12px;
        color: var(--color-text-muted);
      }
      .page-subtitle {
        margin-top: 8px;
        color: var(--color-text-muted);
        max-width: 900px;
      }
      .breadcrumb {
        font-size: 12px;
        color: var(--color-text-muted);
        margin-bottom: 10px;
      }
      .breadcrumb a:hover {
        text-decoration: underline;
      }
      .page-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .page-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .page-frame {
        padding-bottom: 24px;
      }
      .panel {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        min-width: 0;
        overflow: hidden;
      }
      .panel-head {
        padding: 18px 20px;
        border-bottom: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .panel-body {
        padding: 20px;
        min-width: 0;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      .metric {
        background: var(--color-surface);
        padding: 18px 20px;
        border: 1px solid var(--color-border);
        border-radius: 8px;
        min-width: 0;
      }
      .metric-title {
        color: var(--color-text-muted);
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .metric-value {
        font-size: 30px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
        margin: 12px 0 8px;
        overflow-wrap: anywhere;
      }
      .metric-foot {
        font-size: 12px;
        color: var(--color-text-muted);
      }
      .metric-value small {
        font-size: 14px;
        font-weight: 400;
      }
      .positive {
        color: var(--color-success);
      }
      .warning {
        color: var(--color-warning);
      }
      .negative {
        color: var(--color-danger);
      }
      .filter-bar {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        flex-wrap: wrap;
      }
      .filter-bar .field {
        width: 180px;
        max-width: 100%;
      }
      .filter-bar .search {
        width: 260px;
        flex: 1;
        min-width: 180px;
      }
      .filter-bar .field.wide {
        width: 240px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        line-height: 1.3;
        padding: 4px 7px;
        border: 1px solid var(--color-border-strong);
        border-radius: 4px;
        white-space: normal;
      }
      .badge.good {
        color: var(--color-success);
        border-color: color-mix(
          in srgb,
          var(--color-success) 35%,
          var(--color-border)
        );
        background: color-mix(
          in srgb,
          var(--color-success) 6%,
          var(--color-surface)
        );
      }
      .badge.warn {
        color: var(--color-warning);
        border-color: color-mix(
          in srgb,
          var(--color-warning) 35%,
          var(--color-border)
        );
        background: color-mix(
          in srgb,
          var(--color-warning) 6%,
          var(--color-surface)
        );
      }
      .badge.bad {
        color: var(--color-danger);
        border-color: color-mix(
          in srgb,
          var(--color-danger) 35%,
          var(--color-border)
        );
        background: color-mix(
          in srgb,
          var(--color-danger) 6%,
          var(--color-surface)
        );
      }
      .badge.neutral {
        color: var(--color-text-muted);

      function dataForm(title, fields, submit, text = "Сохранить") {

          title,

      function validateFields(container) {
        const inputs = [...container.querySelectorAll("input,select,textarea")];
        let ok = true;
        for (const e of inputs) {
          if (e.type === "text") e.value = e.value.trim();
          if (
            [
              "price-input",
              "price-output",
              "price-cached",
              "budget-limit",
              "sub-amount",
              "price-fee",
            ].includes(e.id)
          )
            e.value = e.value.trim().replace(",", ".");
          if (["price-input", "price-output", "price-cached"].includes(e.id))
            e.pattern = "(0|[1-9][0-9]{0,17})(\\.[0-9]{1,12})?";
          if (["budget-limit", "sub-amount", "price-fee"].includes(e.id))
            e.pattern = "(0|[1-9][0-9]{0,19})(\\.[0-9]{1,18})?";
          if (e.id === "top-p")
            e.setCustomValidity(
              e.value !== "" && Number(e.value) <= 0
                ? "Значение должно быть больше нуля."
                : "",
            );
          const invalid = !e.checkValidity();
          e.setAttribute("aria-invalid", String(invalid));
          if (invalid) {
            if (ok) e.focus();
            ok = false;
          }
        }
        const errorBox = container.querySelector("#dialog-error");
        if (errorBox) {
          errorBox.textContent = ok
            ? ""
            : "Проверьте обязательные поля, числовые границы и формат суммы. Ввод сохранён.";

            '[aria-invalid="true"]',

                if (
                  !old &&
                  budgetRecords.some(
                    (b) =>
                      b.scope === record.scope &&
                      b.target === record.target &&
                      b.currency === record.currency,
                  )
                ) {
                  document.querySelector("#dialog-error").textContent =
                    "Для этой области и валюты бюджет уже существует. Измените его карточку.";
                  return;
                }
                if (old) budgetRecords[editingBudget] = record;
                else budgetRecords.push(record);
              } else {
                const kind = document.getElementById("price-model")
                  ? "prices"
                  : document.getElementById("sub-amount")
                    ? "subscriptions"
                    : "ledger";
                const fields = [...modal.querySelectorAll("input,select")].map(
                  (el) =>
                    (modal.querySelector(`label[for="${el.id}"]`)
                      ?.textContent || el.id) +
                    ": " +
                    (el.tagName === "SELECT"
                      ? el.selectedOptions[0].text
                      : el.value),
                );
                previewChanges.push({
                  kind,
                  name: document.querySelector("#modal-title").textContent,
                  summary: fields.join(" · "),
                });
              }
              closeModal();
              render();
              toast(
                "Запись сохранена в макете. Исторические расходы не изменены.",
              );
            }
            break;
          case "page-next":
            toast(
              "Макет показывает 6 representative записей из периода. В продукте cursor привязан к query/snapshot.",
            );
            break;
          case "stay":
            closeModal();
            break;
          case "discard":
            dirty = false;
            closeModal();
            location.hash = button.dataset.destination;
            break;
          default:
            toast("Сценарий макета: " + action);
        }
      }
      document.addEventListener("click", (e) => {
        const a = e.target.closest("a[href^='#/']");
        if (a && dirty && a.hash !== location.hash) {
          e.preventDefault();
          dialog(
            "Есть несохранённые изменения",
            "<p>Черновик формы ещё не сохранён. Остаться на странице или перейти без сохранения?</p>",
            btn("Остаться", "stay") +
              btn(
                "Выйти без сохранения",
                "discard",
                "danger",
                `data-destination="${a.hash.slice(1)}"`,
              ),
          );
          return;
        }
        if (a && drawer.open) drawer.close();
        const tab = e.target.closest("[data-tab]");
        if (tab) {
          tabChoice[tab.dataset.tab] = tab.dataset.value;
          render();
          return;
        }
        const b = e.target.closest("[data-action]");
        if (b) {
          e.preventDefault();
          handleAction(b.dataset.action, b);
        }
      });
      document.addEventListener("change", (e) => {
        if (["source-price-mode", "project-price-mode"].includes(e.target.id)) {
          modalDirty = true;
          togglePricingFields();
          return;
        }
        if (e.target.id === "context-search") {
          const options = modelOptions(id()).filter(([value]) =>
            value.toLowerCase().includes(e.target.value.toLowerCase()),
          );
          const current = document.querySelector("#context-model").value;
          const choices = options.some(([value]) => value === current)
            ? options
            : [[current, current + " · выбранная"], ...options];
          document.querySelector("#context-model").innerHTML = choices
            .map(
              ([value, label]) =>
                '<option value="' +
                esc(value) +
                '">' +
                esc(label) +
                "</option>",
            )
            .join("");
          document.querySelector("#context-model").value = current;
        }
        if (
          e.target.closest("#dialog-form") &&
          e.target.id !== "context-search"
        )
          modalDirty = true;
        if (e.target.id === "scene-select") {
          scene = e.target.value;
          render();
        }
        if (e.target.id === "theme-select") {
          theme = e.target.value;
          document.documentElement.dataset.theme = theme;
          document.querySelector("#account-menu").hidden = true;
        }
        if (e.target.id === "reserve-provider")
          document.querySelector("#reserve-model").innerHTML = modelOptions(
            e.target.value,
          )
            .map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`)
            .join("");
        if (e.target.id === "namespace-select") {
          if (dirty || modalDirty) {
            pendingNamespace = e.target.value;
            dialog(
              "Есть несохранённые изменения",
              "<p>Смена Namespace изменит контекст страницы. Сохраните черновик или подтвердите переход.</p>",
              btn("Остаться", "namespace-stay") +
                btn("Перейти без сохранения", "namespace-discard", "danger"),
            );
          } else setNamespace(e.target.value);
          return;
        }
        if (e.target.id === "context-model") {
          const old = modal.dataset.contextKey;
          modelContextDrafts[old] =
            document.querySelector("#context-budget").value;
          const next = id() + "/" + e.target.value;
          modal.dataset.contextKey = next;
          document.querySelector("#context-budget").value =
            modelContextDrafts[next] ?? modelContexts[next] ?? "";
          return;
        }
        if (e.target.id === "client-namespace") {
          document.querySelector("#client-project").value =
            namespaceCatalog.find((n) => n.id === e.target.value)?.label ||
            "Без привязки";
        }
        if (e.target.id === "budget-scope") refreshBudgetTarget();
        if (e.target.id === "model-mode") {
          document.querySelector("#deployment-list").innerHTML = deployments(
            e.target.value,
            activeProfile?.model,
          );
          const attempts = document.querySelector("#max-attempts");
          attempts.disabled = e.target.value === "pinned_test";
          attempts.value = e.target.value === "pinned_test" ? "1" : "3";
          document.querySelector('[data-action="add-deployment"]').disabled =
            e.target.value === "pinned_test";
          updateProof();
        }
        if (
          [
            "project-filter",
            "period",
            "currency-filter",
            "dimension",
            "request-status",
            "audit-action",
            "provider-status",
            "model-status",
            "model-filter-mode",
          ].includes(e.target.id)
        ) {
          filterValues[e.target.id] = e.target.value;
          const url = new URL(location.href);
          url.searchParams.set(e.target.id, e.target.value);
          history.pushState(null, "", url);
          render();
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "context-search") {
          const options = modelOptions(id()).filter(([value]) =>
            value.toLowerCase().includes(e.target.value.toLowerCase()),
          );
          const current = document.querySelector("#context-model").value;
          const choices = options.some(([value]) => value === current)
            ? options
            : [[current, current + " · выбранная"], ...options];
          document.querySelector("#context-model").innerHTML = choices
            .map(
              ([value, label]) =>
                '<option value="' +
                esc(value) +
                '">' +
                esc(label) +
                "</option>",
            )
            .join("");
          document.querySelector("#context-model").value = current;
        }
        if (
          e.target.closest("#dialog-form") &&
          e.target.id !== "context-search"
        )
          modalDirty = true;
        if (e.target.closest("#model-form")) updateProof();
        if (["provider-query", "model-query"].includes(e.target.id)) {
          const key = e.target.id,
            position = e.target.selectionStart;
          const url = new URL(location.href);
          url.searchParams.set(key, e.target.value);
          history.replaceState(null, "", url);
          filterValues[key] = e.target.value;
          render();
          const next = document.getElementById(key);
          next.focus();
          next.setSelectionRange(position, position);
          return;
        }
        if (e.target.id === "audit-query") {
          filterValues["audit-query"] = e.target.value;
          const queryUrl = new URL(location.href);
          queryUrl.searchParams.set("audit-query", e.target.value);
          history.replaceState(null, "", queryUrl);
          applyListFilters();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (
          e.key === "Enter" &&
          e.target.closest("#dialog-form") &&
          e.target.tagName === "INPUT"
        ) {
          const submit = modal.querySelector(".modal-actions .primary");
          if (submit && !submit.disabled) {
            e.preventDefault();
            handleAction(submit.dataset.action, submit);
            return;
          }
        }
        if (e.key === "Escape")
          document.querySelector("#account-menu").hidden = true;
        const tab = e.target.closest('[role="tab"]');
        if (tab && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
          e.preventDefault();
          const tabs = [...tab.parentElement.querySelectorAll('[role="tab"]')],
            i = tabs.indexOf(tab);
          const next =
            e.key === "Home"
              ? tabs[0]
              : e.key === "End"
                ? tabs.at(-1)
                : tabs[
                    (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) %
                      tabs.length
                  ];
          if (next.dataset.action === "tariff-tab") {
            const value = next.dataset.value;
            handleAction("tariff-tab", next);
            document
              .querySelector(
                '[data-action="tariff-tab"][data-value="' + value + '"]',
              )
              .focus();
            return;
          }
          tabChoice[next.dataset.tab] = next.dataset.value;
          const selector = `[data-tab="${next.dataset.tab}"][data-value="${next.dataset.value}"]`;
          render();
          document.querySelector(selector).focus();
        }
      });
      document.addEventListener("submit", (e) => {
        e.preventDefault();
        const submit = e.target.querySelector(".modal-actions .primary");
        if (submit && !submit.disabled)
          handleAction(submit.dataset.action, submit);
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest('#account-menu,[data-action="account"]'))
          document.querySelector("#account-menu").hidden = true;
      });
      window.addEventListener("beforeunload", (e) => {
        if (dirty || modalDirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      window.addEventListener("popstate", () => {
        readFilters();
        render();
      });
      window.addEventListener("hashchange", () => {
        dirty = false;
        render();
        document.querySelector("#main").focus({ preventScroll: true });
        window.scrollTo({ top: 0, behavior: "instant" });
      });
      modal.addEventListener("cancel", (e) => {
        if (modalDirty) {
          e.preventDefault();
          requestCloseModal();
        }
      });
      render();
    </script>
  </body>
</html>
